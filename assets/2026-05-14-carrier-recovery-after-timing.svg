<rect width="1440" height="700" fill="url(#bg)"/>
<text x="50.0" y="52.0" class="title" text-anchor="start">Carrier recovery after timing</text>
<text x="50.0" y="82.0" class="subtitle" text-anchor="start"><tspan x="50.0" dy="0">Timing recovery fixes when to sample. Carrier recovery removes the remaining common rotation.</tspan></text>
<rect x="40.0" y="170.0" width="420.0" height="470.0" class="panel"/>
<text x="62.0" y="204.0" class="label" text-anchor="start"><tspan x="62.0" dy="0">1. Timing locked, constellation still</tspan><tspan x="62.0" dy="22.0">rotating</tspan></text>
<text x="62.0" y="256.0" class="small" text-anchor="start"><tspan x="62.0" dy="0">Same QPSK symbols at several times after</tspan><tspan x="62.0" dy="20.0">timing is already fixed.</tspan></text>
<rect x="510.0" y="170.0" width="420.0" height="470.0" class="panel"/>
<text x="532.0" y="204.0" class="label" text-anchor="start"><tspan x="532.0" dy="0">2. 4th power reveals common phase</tspan></text>
<text x="532.0" y="234.0" class="small" text-anchor="start"><tspan x="532.0" dy="0">Each time snapshot collapses to one shared</tspan><tspan x="532.0" dy="20.0">phase point.</tspan></text>
<rect x="980.0" y="170.0" width="420.0" height="470.0" class="panel"/>
<text x="1002.0" y="204.0" class="label" text-anchor="start"><tspan x="1002.0" dy="0">3. Fine tracking holds the lock</tspan></text>
<text x="1002.0" y="234.0" class="small" text-anchor="start"><tspan x="1002.0" dy="0">After coarse correction, feedback only</tspan><tspan x="1002.0" dy="20.0">cleans up residual error.</tspan></text>

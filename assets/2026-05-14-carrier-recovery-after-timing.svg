<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071018"/>
    <stop offset="100%" stop-color="#0f1d2b"/>
  </linearGradient>
  <style>

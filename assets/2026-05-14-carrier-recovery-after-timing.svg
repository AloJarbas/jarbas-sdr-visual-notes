<text x="1002.0" y="542.0" class="tiny" text-anchor="start"><tspan x="1002.0" dy="0">After coarse alignment, feedback only corrects</tspan><tspan x="1002.0" dy="20.0">residual error. That is the Costas /</tspan><tspan x="1002.0" dy="20.0">decision-directed sweet spot. Tracking range is</tspan><tspan x="1002.0" dy="20.0">smaller than acquisition range.</tspan></text>
<text x="50.0" y="668.0" class="small" text-anchor="start"><tspan x="50.0" dy="0">Acquisition versus tracking is the key split: symmetry-based coarse alignment first, feedback fine tracking second.</tspan></text>

<rect x="0.0" y="0.0" width="2140.0" height="1600.0" rx="18.0" fill="#08111b" opacity="1.0"/>
<rect x="24.0" y="24.0" width="2092.0" height="1552.0" rx="24.0" fill="#0d1826" opacity="1.0" stroke="#1e293b" stroke-width="2.0"/>
<text x="60.0" y="66.0" class="title" text-anchor="start">Band-edge closed-loop pull with one adjacent interferer</text>
<text x="60.0" y="98.0" class="subtitle" text-anchor="start">The half-sine path stays honest on isolated slope, but this bounded loop test asks what happens after a nearby QPSK channel is actually mixed in.</text>
<rect x="60.0" y="148.0" width="2020.0" height="332.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="84.0" y="186.0" class="label" text-anchor="start">One bounded loop test was enough to turn the static tradeoff into a real receiver claim</text>
<text x="84.0" y="222.0" class="small" text-anchor="start"><tspan x="84.0" dy="0">Same waveform setup as the guardband note: SRRC QPSK, 4 samples/symbol, 63-tap band-edge filters, one adjacent interferer at 1.0 R_s spacing, and one simple blockwise frequency loop. The loop starts at the right</tspan><tspan x="84.0" dy="21.0">carrier. The only job here is to watch how far the adjacent channel pulls it away.</tspan></text>
<rect x="88.0" y="314.0" width="640.0" height="126.0" rx="16.0" fill="#14263a" opacity="1.0" stroke="#93c5fd" stroke-width="1.8"/>
<text x="106.0" y="342.0" class="label" text-anchor="start">Desired only: both loops stay near zero</text>
<text x="106.0" y="368.0" class="tiny" text-anchor="start"><tspan x="106.0" dy="0">Proxy tail pull is 0.0003 R_s and half-sine is 0.0000 R_s. The wider</tspan><tspan x="106.0" dy="18.0">detector is not noisy by itself in this bounded case.</tspan></text>
<rect x="750.0" y="314.0" width="640.0" height="126.0" rx="16.0" fill="#341c12" opacity="1.0" stroke="#facc15" stroke-width="1.8"/>
<text x="768.0" y="342.0" class="label" text-anchor="start">0 dB adjacent: the half-sine slope win turns into larger pull</text>
<text x="768.0" y="368.0" class="tiny" text-anchor="start"><tspan x="768.0" dy="0">Proxy still averages 0.039 R_s with 100% of the tail inside ±0.05 R_s.</tspan><tspan x="768.0" dy="18.0">Half-sine jumps to 0.099 R_s and drops to 0%.</tspan></text>
<rect x="1412.0" y="314.0" width="640.0" height="126.0" rx="16.0" fill="#3a1018" opacity="1.0" stroke="#fda4af" stroke-width="1.8"/>
<text x="1430.0" y="342.0" class="label" text-anchor="start">+6 dB adjacent: both are stressed, but not equally</text>
<text x="1430.0" y="368.0" class="tiny" text-anchor="start"><tspan x="1430.0" dy="0">Proxy reaches 0.064 R_s. Half-sine reaches 0.178 R_s with detector output</tspan><tspan x="1430.0" dy="18.0">still averaging 0.308. The wide lane keeps listening harder into the</tspan><tspan x="1430.0" dy="18.0">neighbor.</tspan></text>
<rect x="60.0" y="536.0" width="980.0" height="700.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="84.0" y="572.0" class="label" text-anchor="start">Tail carrier pull versus adjacent power</text>
<text x="84.0" y="606.0" class="small" text-anchor="start"><tspan x="84.0" dy="0">The y-axis is the mean |residual CFO| over the last eight loop blocks. The dashed line marks the same</tspan><tspan x="84.0" dy="20.0">±0.05 R_s band used for the settle-quality panel.</tspan></text>

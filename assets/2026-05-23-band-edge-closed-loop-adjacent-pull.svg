<text x="508.0" y="1130.0" class="tiny" text-anchor="start"><tspan x="508.0" dy="0">At 0 dB adjacent power, the same loop gain pulls the proxy</tspan><tspan x="508.0" dy="18.0">lane to 0.039 R_s but the half-sine lane to 0.099 R_s. That</tspan><tspan x="508.0" dy="18.0">is not a cosmetic redraw of the static detector bias; it is a</tspan><tspan x="508.0" dy="18.0">loop-level shift.</tspan></text>
<rect x="1100.0" y="536.0" width="980.0" height="700.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="1124.0" y="572.0" class="label" text-anchor="start">How much of the tail stays inside ±0.05 R_s?</text>
<text x="1124.0" y="606.0" class="small" text-anchor="start"><tspan x="1124.0" dy="0">This stays deliberately simple. For each case, count the last eight loop blocks and ask what fraction</tspan><tspan x="1124.0" dy="20.0">remain inside the ±0.05 R_s track-ready band. It is not BER; it is a bounded settle-quality summary.</tspan></text>

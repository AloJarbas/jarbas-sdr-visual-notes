<text x="1548.0" y="1130.0" class="tiny" text-anchor="start"><tspan x="1548.0" dy="0">At 0 dB adjacent power, proxy stays inside the band for 100%</tspan><tspan x="1548.0" dy="18.0">of the tail while half-sine drops to 0%. The isolated-signal</tspan><tspan x="1548.0" dy="18.0">slope fix is real, but it is not the more robust</tspan><tspan x="1548.0" dy="18.0">adjacent-channel loop under this bounded stress.</tspan></text>
<rect x="60.0" y="1288.0" width="2020.0" height="252.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="84.0" y="1322.0" class="label" text-anchor="start">What changed in the repo</text>
<text x="84.0" y="1356.0" class="small" text-anchor="start"><tspan x="84.0" dy="0">The earlier guardband note already showed why the half-sine detector hears more adjacent energy. This pass turns that into the smallest honest loop claim: with the same blockwise loop and the same 1.0 R_s neighbor, both</tspan><tspan x="84.0" dy="20.0">designs stay calm on the desired-only waveform, but once the adjacent channel reaches 0 dB the half-sine lane gets pulled much farther from the true carrier. In this bounded setup the proxy lane averages 0.039 R_s and keeps</tspan><tspan x="84.0" dy="20.0">100% of the tail inside the band, while the half-sine lane averages 0.099 R_s and keeps only 0%.</tspan></text>
<rect x="88.0" y="1398.0" width="640.0" height="102.0" rx="16.0" fill="#14263a" opacity="1.0" stroke="#93c5fd" stroke-width="1.8"/>
<text x="106.0" y="1420.0" class="label" text-anchor="start">Keep</text>
<text x="106.0" y="1442.0" class="tiny" text-anchor="start"><tspan x="106.0" dy="0">• Desired only still looks fine for both designs (0.0003 and 0.0000 R_s tail</tspan><tspan x="106.0" dy="18.0">pull). The half-sine lane still wins the isolated-slope check.</tspan></text>
<rect x="750.0" y="1398.0" width="640.0" height="102.0" rx="16.0" fill="#173126" opacity="1.0" stroke="#4ade80" stroke-width="1.8"/>
<text x="768.0" y="1420.0" class="label" text-anchor="start">New claim</text>
<text x="768.0" y="1442.0" class="tiny" text-anchor="start"><tspan x="768.0" dy="0">• Once the adjacent channel is actually mixed in, the honest comparison</tspan><tspan x="768.0" dy="18.0">becomes loop-level, and under this bounded stress case the wider half-sine</tspan><tspan x="768.0" dy="18.0">lane is not the more robust adjacent-channel loop.</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1580" viewBox="0 0 2140 1580">
<defs><style>.title { fill: #e6eef8; font: 700 38px Arial, sans-serif; }.subtitle { fill: #c8d8ea; font: 400 20px Arial, sans-serif; }.label { fill: #eef4fb; font: 700 24px Arial, sans-serif; }.small { fill: #d4e1ef; font: 400 17px Arial, sans-serif; }.tiny { fill: #d8e4f0; font: 400 14px Arial, sans-serif; }</style></defs>
<rect width="100%" height="100%" fill="#08111c"/>
<text x="60.0" y="72.0" class="title" text-anchor="start">Band-edge filter design comparison</text>
<text x="60.0" y="108.0" class="subtitle" text-anchor="start">A bounded 4 sps check: the GNU Radio / half-sine shape reaches the normalized slope target much sooner than the current proxy, while α = 0.05 still stays soft.</text>
<rect x="60.0" y="150.0" width="1860.0" height="290.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="86.0" y="192.0" class="label" text-anchor="start">The remaining band-edge question was filter shape, not just tap count</text>
<text x="86.0" y="228.0" class="small" text-anchor="start"><tspan x="86.0" dy="0">The earlier slope note showed that raw imbalance and normalized near-lock slope are different objects. This follow-up checks the next narrower question: does the current boxy proxy understate the</tspan><tspan x="86.0" dy="21.0">normalized slope simply because its filter shape is too crude compared with the GNU Radio / fred harris half-sine construction?</tspan></text>
<rect x="88.0" y="288.0" width="590.0" height="118.0" rx="16.0" fill="#3a1018" opacity="1.0" stroke="#fda4af" stroke-width="1.8"/>
<text x="106.0" y="318.0" class="label" text-anchor="start">Current proxy really is filter-limited</text>
<text x="106.0" y="348.0" class="tiny" text-anchor="start"><tspan x="106.0" dy="0">At α = 0.35, the 63-tap proxy only reaches slope 0.670. It does</tspan><tspan x="106.0" dy="18.0">not get close to the normalized target until about 255 taps</tspan><tspan x="106.0" dy="18.0">(0.983).</tspan></text>
<rect x="710.0" y="288.0" width="590.0" height="118.0" rx="16.0" fill="#11263d" opacity="1.0" stroke="#93c5fd" stroke-width="1.8"/>
<text x="728.0" y="318.0" class="label" text-anchor="start">GNU Radio-style shape fixes most of it fast</text>
<text x="728.0" y="348.0" class="tiny" text-anchor="start"><tspan x="728.0" dy="0">At the same α = 0.35, the 63-tap half-sine style already lands at</tspan><tspan x="728.0" dy="18.0">slope 0.986. That is the practical comparison this pass needed.</tspan></text>
<rect x="1298.0" y="288.0" width="590.0" height="118.0" rx="16.0" fill="#142f23" opacity="1.0" stroke="#4ade80" stroke-width="1.8"/>
<text x="1316.0" y="318.0" class="label" text-anchor="start">The tiny-roll-off caveat survives</text>
<text x="1316.0" y="348.0" class="tiny" text-anchor="start"><tspan x="1316.0" dy="0">Even the half-sine design stays soft at α = 0.05 (slope 0.799).</tspan><tspan x="1316.0" dy="18.0">Small excess bandwidth is still a genuinely weaker case, not just</tspan><tspan x="1316.0" dy="18.0">a plotting artifact.</tspan></text>
<rect x="60.0" y="480.0" width="900.0" height="660.0" rx="18.0" fill="#102031" opacity="1.0" stroke="#5d7fa3" stroke-width="2.0"/>
<text x="84.0" y="516.0" class="label" text-anchor="start">Current proxy bandpass</text>
<text x="84.0" y="550.0" class="small" text-anchor="start"><tspan x="84.0" dy="0">Same bounded setup as the previous note, but now plotted explicitly as one design family. It</tspan><tspan x="84.0" dy="20.0">gets the branch intuition right, yet short filters understate the normalized near-lock slope</tspan><tspan x="84.0" dy="20.0">unless the roll-off is large or the tap count is long.</tspan></text>

<text x="84.0" y="1196.0" class="label" text-anchor="start">What this changes in the repo</text>
<text x="84.0" y="1230.0" class="small" text-anchor="start"><tspan x="84.0" dy="0">The repo can now say something tighter than before. The previous raw-imbalance note remains the intuition view. The 2026-05-20 slope note remains the calibration correction. This pass closes</tspan><tspan x="84.0" dy="20.0">the next loophole by showing that the current proxy filter shape itself is responsible for much of the remaining moderate-roll-off underestimation.</tspan></text>
<rect x="88.0" y="1286.0" width="568.0" height="182.0" rx="16.0" fill="#14263a" opacity="1.0" stroke="#93c5fd" stroke-width="1.8"/>
<text x="106.0" y="1318.0" class="label" text-anchor="start">Keep</text>
<circle cx="108.0" cy="1354.0" r="4.5" fill="#93c5fd" opacity="1.0"/>
<text x="124.0" y="1358.0" class="tiny" text-anchor="start"><tspan x="124.0" dy="0">The raw band-edge imbalance panel still belongs in the repo</tspan><tspan x="124.0" dy="18.0">as the first intuition picture.</tspan></text>
<circle cx="108.0" cy="1428.0" r="4.5" fill="#93c5fd" opacity="1.0"/>
<text x="124.0" y="1432.0" class="tiny" text-anchor="start"><tspan x="124.0" dy="0">The small-roll-off case remains genuinely weak even after</tspan><tspan x="124.0" dy="18.0">the filter shape gets better.</tspan></text>
<rect x="706.0" y="1286.0" width="568.0" height="182.0" rx="16.0" fill="#173126" opacity="1.0" stroke="#4ade80" stroke-width="1.8"/>
<text x="724.0" y="1318.0" class="label" text-anchor="start">New claim</text>
<circle cx="726.0" cy="1354.0" r="4.5" fill="#4ade80" opacity="1.0"/>
<text x="742.0" y="1358.0" class="tiny" text-anchor="start"><tspan x="742.0" dy="0">At α = 0.20 and 63 taps, the half-sine style reaches 0.943</tspan><tspan x="742.0" dy="18.0">versus 0.480 for the proxy — about 2.0× more near-lock slope</tspan><tspan x="742.0" dy="18.0">in this bounded setup.</tspan></text>
<circle cx="726.0" cy="1428.0" r="4.5" fill="#4ade80" opacity="1.0"/>
<text x="742.0" y="1432.0" class="tiny" text-anchor="start"><tspan x="742.0" dy="0">So the next public wording should stop treating the old</tspan><tspan x="742.0" dy="18.0">proxy as if it were already a faithful band-edge</tspan><tspan x="742.0" dy="18.0">implementation.</tspan></text>
<rect x="1288.0" y="1286.0" width="568.0" height="182.0" rx="16.0" fill="#341c12" opacity="1.0" stroke="#facc15" stroke-width="1.8"/>
<text x="1306.0" y="1318.0" class="label" text-anchor="start">Next bounded move</text>
<circle cx="1308.0" cy="1354.0" r="4.5" fill="#facc15" opacity="1.0"/>
<text x="1324.0" y="1358.0" class="tiny" text-anchor="start"><tspan x="1324.0" dy="0">If SDR gets one more turn, measure the guardband /</tspan><tspan x="1324.0" dy="18.0">adjacent-channel cost of the wider half-sine design instead</tspan><tspan x="1324.0" dy="18.0">of repeating more slope sweeps.</tspan></text>
<circle cx="1308.0" cy="1428.0" r="4.5" fill="#facc15" opacity="1.0"/>
<text x="1324.0" y="1432.0" class="tiny" text-anchor="start"><tspan x="1324.0" dy="0">Otherwise this branch is honest enough to stop and the queue</tspan><tspan x="1324.0" dy="18.0">can move on.</tspan></text>
</svg>

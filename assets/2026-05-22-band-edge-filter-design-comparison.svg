<text x="1014.0" y="516.0" class="label" text-anchor="start">GNU Radio / half-sine style</text>
<text x="1014.0" y="550.0" class="small" text-anchor="start"><tspan x="1014.0" dy="0">This uses the GNU Radio / fred harris half-sine style band-edge construction. In the same 4</tspan><tspan x="1014.0" dy="20.0">sps setup it gets much closer to the normalized target slope with modest tap counts,</tspan><tspan x="1014.0" dy="20.0">especially once α is at least moderate.</tspan></text>

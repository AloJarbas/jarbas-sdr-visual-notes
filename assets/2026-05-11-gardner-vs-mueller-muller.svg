<text x="60.0" y="58.0" class="title" text-anchor="start">Gardner vs Mueller and Muller</text>
<text x="60.0" y="88.0" class="subtitle" text-anchor="start">Both loops chase symbol timing, but they read different clues from the waveform.</text>
<rect x="50.0" y="130.0" width="1220.0" height="330.0" class="panel"/>
<text x="74.0" y="164.0" class="label" text-anchor="start">1. Gardner TED: watch the midpoint between symbols</text>
<text x="74.0" y="188.0" class="small" text-anchor="start">Non-data-aided intuition at about 2 samples per symbol.</text>
<rect x="50.0" y="480.0" width="1220.0" height="330.0" class="panel"/>
<text x="74.0" y="514.0" class="label" text-anchor="start">2. Mueller and Muller: compare adjacent symbol-spaced samples</text>
<text x="74.0" y="538.0" class="small" text-anchor="start">Decision-directed intuition at 1 sample per symbol after the matched filter.</text>

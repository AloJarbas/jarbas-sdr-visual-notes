<text x="60.0" y="58.0" class="title" text-anchor="start">Gardner vs Mueller and Muller</text>
<text x="60.0" y="92.0" class="subtitle" text-anchor="start"><tspan x="60.0" dy="0">Both loops chase symbol timing, but they read different clues from the waveform.</tspan></text>
<rect x="50.0" y="160.0" width="1220.0" height="330.0" class="panel"/>
<text x="74.0" y="196.0" class="label" text-anchor="start">1. Gardner TED: watch the midpoint between symbols</text>
<text x="74.0" y="222.0" class="small" text-anchor="start"><tspan x="74.0" dy="0">Non-data-aided intuition at about 2 samples per symbol.</tspan></text>
<rect x="50.0" y="530.0" width="1220.0" height="330.0" class="panel"/>
<text x="74.0" y="566.0" class="label" text-anchor="start">2. Mueller and Muller: compare adjacent symbol-spaced samples</text>
<text x="74.0" y="592.0" class="small" text-anchor="start"><tspan x="74.0" dy="0">Decision-directed intuition at 1 sample per symbol after the matched filter.</tspan></text>

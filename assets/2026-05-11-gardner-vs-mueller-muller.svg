<text x="836.0" y="255.0" class="label" text-anchor="start">Gardner cue</text>
<text x="836.0" y="286.0" class="small" text-anchor="start"><tspan x="836.0" dy="0">Use the midpoint sample against the two</tspan><tspan x="836.0" dy="21.0">neighbors. If the zero crossing leans left</tspan><tspan x="836.0" dy="21.0">or right, the error sign tells the loop</tspan><tspan x="836.0" dy="21.0">which way to move.</tspan></text>
<text x="836.0" y="347.0" class="small" text-anchor="start">Why it helps</text>
<text x="836.0" y="368.0" class="tiny" text-anchor="start"><tspan x="836.0" dy="0">No symbol decisions required yet, so it is useful</tspan><tspan x="836.0" dy="18.0">early in the receive chain.</tspan></text>
<text x="836.0" y="402.0" class="small" text-anchor="start">Tradeoff</text>
<text x="836.0" y="423.0" class="tiny" text-anchor="start"><tspan x="836.0" dy="0">It wants at least about 2 samples per symbol</tspan><tspan x="836.0" dy="18.0">because it explicitly watches the midpoint.</tspan></text>
<line x1="350.0" y1="620.0" x2="350.0" y2="790.0" stroke="#f8fafc" stroke-width="2.0" opacity="0.9" stroke-dasharray="8 8"/>
<circle cx="350.0" cy="651.9" r="6.0" fill="#f8fafc" opacity="1.0"/>
<text x="350.0" y="836.0" class="tiny" text-anchor="middle">prev sample</text>
<line x1="526.0" y1="620.0" x2="526.0" y2="790.0" stroke="#22c55e" stroke-width="2.0" opacity="0.9" stroke-dasharray="8 8"/>
<circle cx="526.0" cy="758.1" r="6.0" fill="#22c55e" opacity="1.0"/>
<text x="526.0" y="836.0" class="tiny" text-anchor="middle">current sample</text>
<circle cx="350.0" cy="844.0" r="5.0" fill="#f97316" opacity="1.0"/>
<text x="350.0" y="864.0" class="tiny" text-anchor="middle">+1 decision</text>
<circle cx="526.0" cy="844.0" r="5.0" fill="#f97316" opacity="1.0"/>
<text x="526.0" y="864.0" class="tiny" text-anchor="middle">-1 decision</text>
<text x="836.0" y="625.0" class="label" text-anchor="start">Mueller and Muller cue</text>
<text x="836.0" y="656.0" class="small" text-anchor="start"><tspan x="836.0" dy="0">Compare adjacent symbol-spaced</tspan><tspan x="836.0" dy="21.0">matched-filter samples after slicing. It</tspan><tspan x="836.0" dy="21.0">uses pulse symmetry: with correct timing,</tspan><tspan x="836.0" dy="21.0">neighboring sidelobe contributions</tspan><tspan x="836.0" dy="21.0">balance.</tspan></text>
<text x="836.0" y="717.0" class="small" text-anchor="start">Why it helps</text>
<text x="836.0" y="738.0" class="tiny" text-anchor="start"><tspan x="836.0" dy="0">It can work at 1 sample per symbol, so it fits a</tspan><tspan x="836.0" dy="18.0">later decision-directed stage.</tspan></text>
<text x="836.0" y="772.0" class="small" text-anchor="start">Tradeoff</text>
<text x="836.0" y="793.0" class="tiny" text-anchor="start"><tspan x="836.0" dy="0">Bad decisions or the wrong pulse shape can poison</tspan><tspan x="836.0" dy="18.0">the timing cue. Gardner reads the midpoint; M&amp;M</tspan><tspan x="836.0" dy="18.0">reads adjacent decided symbols.</tspan></text>
<text x="86.0" y="892.0" class="small" text-anchor="start"><tspan x="86.0" dy="0">Layout rule used here: the notes now live in a dedicated column, so explanatory copy cannot collide with the waveform.</tspan></text>
</svg>

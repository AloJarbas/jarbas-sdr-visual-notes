<text x="660.0" y="405.0" class="tiny" text-anchor="middle">late</text>
<text x="900.0" y="205.0" class="label" text-anchor="start">Gardner cue</text>
<text x="900.0" y="232.0" class="small" text-anchor="start">Use the midpoint sample against the two neighbors.</text>
<text x="900.0" y="256.0" class="tiny" text-anchor="start">If the zero crossing leans left or right, the sign of the error tells the loop which way to move.</text>
<text x="900.0" y="282.0" class="small" text-anchor="start">Why it helps:</text>
<text x="900.0" y="304.0" class="tiny" text-anchor="start">No symbol decisions required yet, so it is useful early in the receive chain.</text>
<text x="900.0" y="328.0" class="small" text-anchor="start">Tradeoff:</text>
<text x="900.0" y="350.0" class="tiny" text-anchor="start">It wants at least about 2 samples per symbol because it explicitly watches the midpoint.</text>
<line x1="510.0" y1="540.0" x2="510.0" y2="750.0" stroke="#f8fafc" stroke-width="2.0" opacity="0.9" stroke-dasharray="8 8"/>
<circle cx="510.0" cy="579.4" r="6.0" fill="#f8fafc" opacity="1.0"/>
<text x="510.0" y="755.0" class="tiny" text-anchor="middle">prev sample</text>
<line x1="810.0" y1="540.0" x2="810.0" y2="750.0" stroke="#22c55e" stroke-width="2.0" opacity="0.9" stroke-dasharray="8 8"/>
<circle cx="810.0" cy="710.6" r="6.0" fill="#22c55e" opacity="1.0"/>
<text x="810.0" y="755.0" class="tiny" text-anchor="middle">current sample</text>
<circle cx="510.0" cy="764.0" r="5.0" fill="#f97316" opacity="1.0"/>
<text x="510.0" y="786.0" class="tiny" text-anchor="middle">+1 decision</text>
<circle cx="810.0" cy="764.0" r="5.0" fill="#f97316" opacity="1.0"/>
<text x="810.0" y="786.0" class="tiny" text-anchor="middle">-1 decision</text>
<text x="900.0" y="555.0" class="label" text-anchor="start">Mueller and Muller cue</text>
<text x="900.0" y="582.0" class="small" text-anchor="start">Compare adjacent symbol-spaced matched-filter samples after slicing.</text>
<text x="900.0" y="606.0" class="tiny" text-anchor="start">It uses pulse symmetry: if timing is right, the neighboring sidelobe contributions balance.</text>
<text x="900.0" y="632.0" class="small" text-anchor="start">Why it helps:</text>
<text x="900.0" y="654.0" class="tiny" text-anchor="start">It can work at 1 sample per symbol, so it fits a later decision-directed stage.</text>
<text x="900.0" y="678.0" class="small" text-anchor="start">Tradeoff:</text>
<text x="900.0" y="700.0" class="tiny" text-anchor="start">Bad decisions or the wrong pulse shape can poison the timing cue.</text>
<text x="900.0" y="724.0" class="small" text-anchor="start">Rule of thumb:</text>
<text x="900.0" y="746.0" class="tiny" text-anchor="start">Gardner reads the midpoint. M&M reads adjacent decided symbols.</text>
<text x="88.0" y="447.0" class="small" text-anchor="start">Gardner is about the zero crossing between symbols.</text>
<text x="88.0" y="797.0" class="small" text-anchor="start">Mueller and Muller is about balance across neighboring symbol-spaced samples.</text>
</svg>

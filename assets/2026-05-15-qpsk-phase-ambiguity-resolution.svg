<text x="558.0" y="500.0" class="tiny" text-anchor="start">try -180°</text>
<text x="754.0" y="500.0" class="mono" text-anchor="middle">00  01  11  10</text>
<text x="910.0" y="500.0" class="tiny" text-anchor="end">match</text>

<text x="62.0" y="640.0" class="tiny" text-anchor="start"><tspan x="62.0" dy="0">Once the loop stops the fast spin, the cloud is</tspan><tspan x="62.0" dy="20.0">stable. But QPSK still has four equally valid</tspan><tspan x="62.0" dy="20.0">labelings, separated by 90°.</tspan></text>
<text x="542.0" y="310.0" class="tiny" text-anchor="start">expected unique word:</text>
<text x="766.0" y="310.0" class="mono" text-anchor="middle">00  01  11  10</text>

<text x="1220.0" y="662.0" class="mono" text-anchor="middle">phase steps on both rows: +90°, +90°, -90°</text>
<text x="1022.0" y="698.0" class="tiny" text-anchor="start"><tspan x="1022.0" dy="0">Differential encoding keeps information in</tspan><tspan x="1022.0" dy="20.0">symbol-to-symbol phase changes, so a constant</tspan><tspan x="1022.0" dy="20.0">quadrant offset cancels during differential</tspan><tspan x="1022.0" dy="20.0">decoding. This is still coherent carrier recovery,</tspan><tspan x="1022.0" dy="20.0">not noncoherent differential detection.</tspan></text>
<text x="50.0" y="722.0" class="small" text-anchor="start"><tspan x="50.0" dy="0">Known symbols fix the labeling after lock. Differential encoding avoids caring about the absolute quadrant.</tspan></text>
</svg>

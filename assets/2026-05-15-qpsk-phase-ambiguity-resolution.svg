<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="760" viewBox="0 0 1580 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#071018"/>
    <stop offset="100%" stop-color="#0f1d2b"/>
  </linearGradient>
  <style>
    .title { font: 700 32px Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .subtitle { font: 500 18px Helvetica, Arial, sans-serif; fill: #9fb3c8; }
    .label { font: 700 18px Helvetica, Arial, sans-serif; fill: #dce7f3; }
    .small { font: 500 15px Helvetica, Arial, sans-serif; fill: #9fb3c8; }
    .tiny { font: 500 14px Helvetica, Arial, sans-serif; fill: #9fb3c8; }
    .micro { font: 600 12px Helvetica, Arial, sans-serif; fill: #dce7f3; }
    .mono { font: 600 18px Menlo, Consolas, monospace; fill: #e6edf3; }
    .badge { font: 700 12px Helvetica, Arial, sans-serif; fill: #eff6ff; }
    .axislabel { font: 600 13px Helvetica, Arial, sans-serif; fill: #dce7f3; }
    .panel { fill: #122131; stroke: #5e7fa3; stroke-width: 2; rx: 18; }
  </style>
</defs>
<rect width="1580" height="760" fill="url(#bg)"/>
<text x="50.0" y="52.0" class="title" text-anchor="start">QPSK phase ambiguity resolution</text>
<text x="50.0" y="82.0" class="subtitle" text-anchor="start"><tspan x="50.0" dy="0">Carrier lock can stop rotation without fixing the QPSK labels.</tspan><tspan x="50.0" dy="24.0">Known symbols or differential encoding finish the job.</tspan></text>
<rect x="40.0" y="170.0" width="440.0" height="510.0" class="panel"/>
<text x="62.0" y="204.0" class="label" text-anchor="start"><tspan x="62.0" dy="0">1. Carrier lock can still leave four</tspan><tspan x="62.0" dy="22.0">labelings</tspan></text>
<text x="62.0" y="256.0" class="small" text-anchor="start"><tspan x="62.0" dy="0">A decision-directed QPSK loop removes rotation,</tspan><tspan x="62.0" dy="20.0">but the final lock is only known modulo 90°.</tspan></text>
<rect x="520.0" y="170.0" width="440.0" height="510.0" class="panel"/>
<text x="542.0" y="204.0" class="label" text-anchor="start"><tspan x="542.0" dy="0">2. Known symbols choose the right</tspan><tspan x="542.0" dy="22.0">rotation</tspan></text>
<text x="542.0" y="256.0" class="small" text-anchor="start"><tspan x="542.0" dy="0">Test the four candidate rotations against a</tspan><tspan x="542.0" dy="20.0">known pattern and keep the one that matches.</tspan></text>
<rect x="1000.0" y="170.0" width="440.0" height="510.0" class="panel"/>
<text x="1022.0" y="204.0" class="label" text-anchor="start"><tspan x="1022.0" dy="0">3. Differential encoding makes constant</tspan><tspan x="1022.0" dy="22.0">rotation harmless</tspan></text>
<text x="1022.0" y="256.0" class="small" text-anchor="start"><tspan x="1022.0" dy="0">Absolute phase may shift, but symbol-to-symbol</tspan><tspan x="1022.0" dy="20.0">phase changes survive a fixed quadrant offset.</tspan></text>

<text x="542.0" y="638.0" class="tiny" text-anchor="start"><tspan x="542.0" dy="0">Known symbols or a unique word let the receiver</tspan><tspan x="542.0" dy="20.0">test the four rotations and keep the one that</tspan><tspan x="542.0" dy="20.0">matches the expected pattern.</tspan></text>
